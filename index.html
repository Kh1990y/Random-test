<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFAAQ Readiness Simulation</title>
<style>
:root{
  --navy:#0B1E33; --navy-2:#122A45; --sky:#3E8FB0; --amber:#F2A541;
  --ok:#3FA66A; --bad:#D6553B; --ink:#EAF1F7; --ink-dim:#9FB3C8; --card:#14293F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  min-height:100%;
  background:radial-gradient(ellipse at top,#16324F 0%,var(--navy) 55%,#081522 100%);
  color:var(--ink);
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  display:flex;justify-content:center;
}
#app{width:100%;max-width:640px;padding:18px 16px 40px;}
.eyebrow{font-size:12px;letter-spacing:.4px;color:var(--sky);font-weight:600}
h1{font-size:26px;font-weight:700;margin-top:4px;line-height:1.25}
p.lede{color:var(--ink-dim);font-size:14.5px;line-height:1.55;margin-top:10px}
.note{margin-top:16px;background:rgba(242,165,65,.08);border-left:3px solid var(--amber);padding:12px 14px;border-radius:6px;font-size:13px;color:var(--ink-dim);line-height:1.5;}
.track-pill{display:inline-block;margin-top:16px;padding:6px 12px;border:1px solid rgba(255,255,255,.15);border-radius:20px;font-size:12.5px;color:var(--ink-dim);}
button{font-family:inherit;cursor:pointer}
.btn{border:none;border-radius:8px;padding:14px 20px;font-size:15px;font-weight:600;background:var(--sky);color:#06121F;width:100%;margin-top:14px;transition:transform .15s ease, opacity .15s ease;}
.btn:active{transform:scale(.98)}
.btn.secondary{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:18px;}
.timer{font-variant-numeric:tabular-nums;font-size:19px;font-weight:700;letter-spacing:.5px;color:var(--ink);background:var(--card);padding:7px 14px;border-radius:7px;border:1px solid rgba(255,255,255,.08);}
.timer.low{color:var(--bad);border-color:var(--bad)}
.section-label{font-size:12.5px;color:var(--ink-dim)}
.section-label b{color:var(--ink)}
.progress-track{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:20px}
.progress-fill{height:100%;background:var(--amber);transition:width .35s ease}
.card{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:20px 18px;opacity:0;transform:translateY(6px);animation:fadeIn .35s ease forwards;}
@keyframes fadeIn{to{opacity:1;transform:translateY(0)}}
.card.fadeOut{animation:fadeOut .22s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:translateY(-6px)}}
.diff{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--amber);font-weight:700}
.qtext{font-size:17px;line-height:1.5;margin-top:8px;font-weight:600}
.options{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px 14px;color:var(--ink);font-size:14.5px;transition:.15s ease;}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt.correct{background:rgba(63,166,106,.18);border-color:var(--ok)}
.opt.incorrect{background:rgba(214,85,59,.18);border-color:var(--bad)}
.opt:disabled{cursor:default}
.row-btns{display:flex;gap:10px;margin-top:16px}
.hint-btn{background:transparent;border:1px dashed rgba(255,255,255,.25);color:var(--ink-dim);border-radius:8px;padding:10px 14px;font-size:13.5px;flex:1;}
.hint-box{margin-top:12px;font-size:13.5px;color:var(--ink-dim);background:rgba(62,143,176,.1);border-radius:8px;padding:10px 12px;border-left:3px solid var(--sky);display:none;line-height:1.5;}
.hint-box.show{display:block}
.next-btn{flex:1}
.feedback-tag{display:inline-block;margin-top:14px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:6px;}
.feedback-tag.ok{background:rgba(63,166,106,.18);color:var(--ok)}
.feedback-tag.bad{background:rgba(214,85,59,.18);color:var(--bad)}
.hidden{display:none !important}
.result-section{background:var(--card);border-radius:10px;padding:14px 16px;margin-top:12px;border:1px solid rgba(255,255,255,.06);}
.result-section .rowline{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-dim);margin-bottom:6px}
.bar-track{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--sky)}
.score-hero{text-align:center;padding:18px 0 6px}
.score-hero .big{font-size:44px;font-weight:800;color:var(--amber)}
.score-hero .small{color:var(--ink-dim);font-size:13.5px;margin-top:2px}
.review-toggle{background:none;border:none;color:var(--sky);font-size:13px;font-weight:600;margin-top:8px;padding:0;text-align:left;}
.review-item{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.1);font-size:13px;line-height:1.5;}
.review-item .rq{font-weight:600;color:var(--ink)}
.review-item .ra{color:var(--bad)}
.review-item .rc{color:var(--ok)}
.review-list{display:none}
.review-list.show{display:block}
</style>
</head>

    {diff:"Hard", q:"Choose the sentence with the correct verb tense:", options:["By the time we arrived, the meeting had already started.","By the time we arrived, the meeting has already started.","By the time we arrived, the meeting starts already.","By the time we arrive, the meeting had already start."], correct:0, hint:"An earlier past event needs the past perfect tense ('had' + past participle)."},

},
{

// ---- STATE ----------------------------------------------------------------
const TOTAL_QUESTIONS = sections.reduce((a,s)=>a+s.questions.length,0);
const TOTAL_SECONDS = TOTAL_QUESTIONS * 60; // 1 minute per question, per your rule
let timeLeft = TOTAL_SECONDS;
let secIdx = 0, qIdx = 0, answered = false, timerHandle = null;
let results = sections.map(s => ({correct:0, total:s.questions.length}));
let userAnswers = sections.map(s => s.questions.map(()=>null));

const app = document.getElementById('app');

function fmtTime(s){
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  const p = n => String(n).padStart(2,'0');
  return `${p(h)}:${p(m)}:${p(sec)}`;
}

function startTimer(){
  timerHandle = setInterval(()=>{
    timeLeft--;
    const el = document.getElementById('timerDisplay');
    if(el){
      el.textContent = fmtTime(Math.max(timeLeft,0));
      el.classList.toggle('low', timeLeft <= Math.min(300, TOTAL_SECONDS*0.1));
    }
    if(timeLeft <= 0){
      clearInterval(timerHandle);
      renderResults();
    }
  },1000);
}

function renderStart(){
  const mins = Math.round(TOTAL_SECONDS/60);
  app.innerHTML = `
    <span class="eyebrow">PRACTICE SIMULATION · UNOFFICIAL</span>
    <h1>AFAAQ Readiness Check</h1>
    <p class="lede">A self-timed practice run modeled on the general shape of graduate-program admission assessments: reasoning, English, IT, and data/security fundamentals. Track: Computer/IT &amp; Data.</p>
    <div class="note">This is not an official SANS AFAAQ test — the real program's exact assessment content isn't publicly disclosed. Treat this as general practice, not a guaranteed format.</div>
    <div class="track-pill">⏱ ${fmtTime(TOTAL_SECONDS)} total (1 min/question) · ${sections.length} sections · ${TOTAL_QUESTIONS} questions</div>
    <button class="btn" onclick="beginTest()">Start Simulation</button>
  `;
}

function beginTest(){
  timeLeft = TOTAL_SECONDS;
  secIdx = 0; qIdx = 0;
  results = sections.map(s => ({correct:0, total:s.questions.length}));
  userAnswers = sections.map(s => s.questions.map(()=>null));
  startTimer();
  renderQuestion();
}

function totalProgress(){
  let done = 0;
  for(let i=0;i<secIdx;i++) done += sections[i].questions.length;
  done += qIdx;
  return {done, total: TOTAL_QUESTIONS};
}

function renderQuestion(){
  answered = false;
  const section = sections[secIdx];
  const q = section.questions[qIdx];
  const {done,total} = totalProgress();
  const pct = Math.round((done/total)*100);

  app.innerHTML = `
    <div class="topbar">
      <div>
        <div class="section-label">Section ${secIdx+1}/${sections.length} · <b>${section.name}</b></div>
        <div class="section-label">Question ${qIdx+1} of ${section.questions.length}</div>
      </div>
      <div class="timer" id="timerDisplay">${fmtTime(Math.max(timeLeft,0))}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card" id="qcard">
      <div class="diff">${q.diff}</div>
      <div class="qtext">${q.q}</div>
      <div class="options" id="optionsWrap">
        ${q.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="selectOption(${i})">${o}</button>`).join('')}
      </div>
      <div id="feedbackWrap"></div>
      <div class="hint-box" id="hintBox">${q.hint}</div>
      <div class="row-btns">
        <button class="hint-btn" onclick="toggleHint()">💡 Show Hint</button>
        <button class="btn next-btn hidden" id="nextBtn" onclick="nextQuestion()">Next →</button>
      </div>
    </div>
  `;
  document.getElementById('timerDisplay').classList.toggle('low', timeLeft <= Math.min(300, TOTAL_SECONDS*0.1));
}

function toggleHint(){
  document.getElementById('hintBox').classList.toggle('show');
}

function selectOption(i){
  if(answered) return;
  answered = true;
  const q = sections[secIdx].questions[qIdx];
  userAnswers[secIdx][qIdx] = i;
  const opts = document.querySelectorAll('.opt');
  opts.forEach((btn,idx)=>{
    btn.disabled = true;
    if(idx === q.correct) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('incorrect');
  });
  const fb = document.getElementById('feedbackWrap');
  if(i === q.correct){
    results[secIdx].correct++;
    fb.innerHTML = `<span class="feedback-tag ok">✓ Correct</span>`;
  } else {
    fb.innerHTML = `<span class="feedback-tag bad">✗ Incorrect</span>`;
  }
  document.getElementById('nextBtn').classList.remove('hidden');
}

function nextQuestion(){
  const card = document.getElementById('qcard');
  card.classList.add('fadeOut');
  setTimeout(()=>{
    if(qIdx < sections[secIdx].questions.length - 1){
      qIdx++;
    } else if(secIdx < sections.length - 1){
      secIdx++; qIdx = 0;
    } else {
      clearInterval(timerHandle);
      renderResults();
      return;
    }
    renderQuestion();
  }, 200);
}

function toggleReview(i){
  document.getElementById('reviewList'+i).classList.toggle('show');
}

function renderResults(){
  clearInterval(timerHandle);
  const totalCorrect = results.reduce((a,r)=>a+r.correct,0);
  const pct = Math.round((totalCorrect/TOTAL_QUESTIONS)*100);
  app.innerHTML = `
    <span class="eyebrow">SIMULATION COMPLETE</span>
    <h1>Your Results</h1>
    <div class="score-hero">
      <div class="big">${pct}%</div>
      <div class="small">${totalCorrect} of ${TOTAL_QUESTIONS} correct · time used: ${fmtTime(TOTAL_SECONDS - Math.max(timeLeft,0))}</div>
    </div>
    ${sections.map((s,i)=>{
      const r = results[i];
      const p = Math.round((r.correct/r.total)*100);
      const missed = s.questions.map((q,qi)=>({q,qi})).filter(o => userAnswers[i][o.qi] !== o.q.correct);
      const missedHtml = missed.map(o=>{
        const ua = userAnswers[i][o.qi];
        const userTxt = ua === null ? "No answer" : o.q.options[ua];
        return `<div class="review-item">
          <div class="rq">Q${o.qi+1}. ${o.q.q}</div>
          <div>Your answer: <span class="ra">${userTxt}</span> · Correct: <span class="rc">${o.q.options[o.q.correct]}</span></div>
        </div>`;
      }).join('');
      return `<div class="result-section">
        <div class="rowline"><span>${s.name}</span><span>${r.correct}/${r.total}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div>
        ${missed.length ? `<button class="review-toggle" onclick="toggleReview(${i})">Show ${missed.length} missed question${missed.length>1?'s':''} ▾</button>
        <div class="review-list" id="reviewList${i}">${missedHtml}</div>` : ''}
      </div>`;
    }).join('')}
    <button class="btn" onclick="beginTest()">Retake Simulation</button>
    <button class="btn secondary" onclick="renderStart()">Back to Start</button>
  `;
}

renderStart();
</script>
</body>
